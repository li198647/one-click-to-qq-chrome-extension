<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #2C2C2A;
      background: #ffffff;
    }

    /* ---------------------------------------------- 标题行

       左边是名字，右边是发送按钮 —— 按钮刻意做成 Windows 对话框
       「是 / 否」那种小尺寸（88 × 26，字号 12px），而不是占满一整行
       的大按钮。发送是这个弹窗唯一的主动作，但不值得用一整个通栏
       去强调它；放在右上方也和系统对话框的肌肉记忆一致。 */
    .titleRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 14px;
      font-weight: 500;
      margin: 0;
      min-width: 0;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 8px;
      background: #F1EFE8;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #B4B2A9;
      flex: 0 0 auto;
    }
    .dot.ok { background: #1D9E75; }
    .dot.bad { background: #E24B4A; }
    #statusText { flex: 1; }

    /* ---------------------------------------------- 将要发送（独立一块）

       这一块只放"这一下会发出去的那段文字"，文字本体自己再套一个
       实线矩形（.sbText）。和下面的候选列表在视觉上完全分开 ——
       候选是"能挑的东西"，这里是"已经定下的东西"。 */
    .sendbox {
      border-radius: 8px;
      padding: 8px 10px 9px;
      margin-bottom: 12px;
      background: #E6F1FB;
      border: 0.5px solid #185FA5;
    }
    /* 标题，小字。它只是个标签，所以比正文（13px）小一档。
       出错时这里会接替原来的字数提示行，变成红色的多行说明 ——
       pre-line 就是为了让那些换行生效。 */
    .sbHead {
      font-size: 11px;
      font-weight: 500;
      color: #0C447C;
      margin-bottom: 6px;
      line-height: 1.5;
      white-space: pre-line;
    }
    /* 文字本体：被框住的那个矩形 */
    .sbText {
      border: 1px solid #185FA5;
      border-radius: 6px;
      background: #FFFFFF;
      padding: 7px 9px;
      font-size: 13px;
      line-height: 1.5;
      color: #042C53;
      word-break: break-all;
      min-height: 34px;
    }

    /* v1.0.1：这一次要发的是图片时，上面那个文字框换成一张**真缩略图**。
       「到底要发哪张」看这里就够了，不用去猜候选行里那行小字。
       宽度限 100%、高度限 160px —— 手机截图是竖长条，只限宽的话会把
       弹窗撑成一根竹竿。 */
    .sbThumbWrap { display: none; }
    .sbThumb {
      display: block;
      max-width: 100%;
      max-height: 160px;
      border: 1px solid #185FA5;
      border-radius: 6px;
      background: #FFFFFF;
    }
    .sbThumbMeta {
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.5;
      color: #0C447C;
      word-break: break-all;
    }

    .sendbox.err { background: #FCEBEB; border-color: #A32D2D; }
    .sendbox.err .sbHead { color: #791F1F; }
    .sendbox.err .sbText { border-color: #A32D2D; color: #791F1F; }
    .sendbox.err .sbThumb { border-color: #A32D2D; }

    /* ---------------------------------------------- 候选（另一块） */
    .candsHead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .candsTitle {
      font-size: 12px;
      font-weight: 500;
      color: #444441;
    }
    .candsTip { font-size: 11px; color: #8A8880; }
    .cand {
      display: flex;
      gap: 7px;
      padding: 6px 9px;
      border: 0.5px solid #D8D6CE;
      border-radius: 6px;
      margin-bottom: 5px;
      background: #FFFFFF;
      color: #5F5E5A;
      font-size: 12.5px;
      line-height: 1.45;
      word-break: break-all;
      cursor: pointer;
    }
    .cand:last-child { margin-bottom: 0; }
    .cand:hover { background: #EEF4FB; border-color: #85B7EB; }
    .candNo { flex: 0 0 auto; color: #B4B2A9; font-size: 11px; line-height: 1.7; }
    .candTxt { flex: 1; }
    /* v1.0.1：图片候选行前面的小徽标。行高刻意和文字行保持一致 ——
       真在候选行里画缩略图会让那一行比其它三行高，列表参差不齐。 */
    .candIcon { flex: 0 0 auto; align-self: center; color: #185FA5; }
    /* 当前选中：深色底 + 蓝框，和上面那个框里是同一段文字 */
    .cand.sel {
      background: #85B7EB;
      border-color: #185FA5;
      color: #042C53;
      font-weight: 500;
      cursor: default;
    }
    .cand.sel:hover { background: #85B7EB; }
    .cand.sel .candNo { color: #0C447C; }
    .candsNote {
      font-size: 12px;
      line-height: 1.5;
      color: #854F0B;
      margin-top: 6px;
      white-space: pre-line;
      display: none;
    }
    .candsNote.show { display: block; }

    /* Windows 对话框风格的小按钮：88 × 26。
       用 min-width 而不是固定 width —— 「发送第 3 条」比「立即发送」
       宽一个字加一个数字，写死宽度会把它挤到换行。 */
    button {
      flex: 0 0 auto;
      min-width: 88px;
      height: 26px;
      margin: 0;
      padding: 0 10px;
      border: 0.5px solid #185FA5;
      border-radius: 4px;
      background: #E6F1FB;
      color: #0C447C;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #B5D4F4; }
    button:disabled { opacity: 0.5; cursor: default; }
    .hint {
      margin-top: 10px;
      color: #5F5E5A;
      font-size: 12px;
      line-height: 1.6;
    }
    kbd {
      font-family: Consolas, monospace;
      font-size: 11px;
      padding: 1px 5px;
      border: 0.5px solid #B4B2A9;
      border-radius: 4px;
      background: #F1EFE8;
    }
    .lnk {
      color: #185FA5;
      cursor: pointer;
      text-decoration: underline;
    }
    .lnk:hover { color: #0C447C; }
    #detail {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.6;
      word-break: break-all;
      display: none;
    }
    #detail.show {
      display: block;
      padding: 8px 9px;
      border-radius: 8px;
      background: #F1EFE8;
      color: #444441;
    }
    #detail.err {
      background: #FCEBEB;
      color: #791F1F;
    }
    /* 底部一行小字：每一路监听各记下了几条 + 当前版本号。
       出问题时能一眼看出是哪一路没在工作。 */
    .diag {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #8A8880;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <!-- 标题行：名字在左，发送按钮在右（Windows 对话框那种小按钮） -->
  <div class="titleRow">
    <h1>一键发到 QQ</h1>
    <button id="sendBtn">立即发送</button>
  </div>

  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="statusText">正在检查本地桥…</span>
  </div>

  <!-- 将要发送：文字单独被框住。只有标题 + 文字本体两块，
       原来那行「共 N 字」已按木木要求去掉。
       v1.0.1：这一次要发的是图片时，下面那个文字矩形换成真缩略图。 -->
  <div class="sendbox" id="sendBox">
    <div class="sbHead" id="sbHead">正在读取剪贴板…</div>
    <div class="sbText" id="sbText"></div>
    <div class="sbThumbWrap" id="sbThumbWrap">
      <img class="sbThumb" id="sbThumb" alt="将要发送的图片">
      <div class="sbThumbMeta" id="sbThumbMeta"></div>
    </div>
  </div>

  <!-- 候选：另起一块 -->
  <div class="candsHead" id="candsHead" style="display:none">
    <span class="candsTitle" id="candsTitleText">最近的内容</span>
    <span class="candsTip">点一行改成发那条</span>
  </div>
  <div id="candsList"></div>
  <div class="candsNote" id="candsNote"></div>

  <div class="hint" id="lastLine"></div>
  <div class="hint">
    快捷键 <kbd>Ctrl</kbd> + <kbd>B</kbd> 永远发最新那条，这里的选择不影响它。<br>
    <span class="lnk" id="clearLink">清空历史</span>
  </div>

  <div id="detail"></div>
  <div class="diag" id="diag"></div>

  <!-- imageutil.js 必须在 popup.js 之前：读剪贴板里的图片要用它。 -->
  <script src="imageutil.js"></script>
  <script src="popup.js"></script>
</body>
</html>
