<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #2C2C2A;
      background: #ffffff;
    }
    h1 {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 10px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 8px;
      background: #F1EFE8;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #B4B2A9;
      flex: 0 0 auto;
    }
    .dot.ok { background: #1D9E75; }
    .dot.bad { background: #E24B4A; }
    #statusText { flex: 1; }

    /* ---------------------------------------------- 将要发送（独立一块）

       这一块只放"这一下会发出去的那段文字"，文字本体自己再套一个
       实线矩形（.sbText）。和下面的候选列表在视觉上完全分开 ——
       候选是"能挑的东西"，这里是"已经定下的东西"。 */
    .sendbox {
      border-radius: 8px;
      padding: 8px 10px 9px;
      margin-bottom: 12px;
      background: #E6F1FB;
      border: 0.5px solid #185FA5;
    }
    .sbHead {
      font-size: 12px;
      font-weight: 500;
      color: #0C447C;
      margin-bottom: 6px;
    }
    /* 文字本体：被框住的那个矩形 */
    .sbText {
      border: 1px solid #185FA5;
      border-radius: 6px;
      background: #FFFFFF;
      padding: 7px 9px;
      font-size: 13px;
      line-height: 1.5;
      color: #042C53;
      word-break: break-all;
      min-height: 34px;
    }
    .sbMeta {
      font-size: 12px;
      line-height: 1.5;
      color: #185FA5;
      margin-top: 6px;
      white-space: pre-line;
    }
    .sendbox.err { background: #FCEBEB; border-color: #A32D2D; }
    .sendbox.err .sbHead { color: #791F1F; }
    .sendbox.err .sbText { border-color: #A32D2D; color: #791F1F; }
    .sendbox.err .sbMeta { color: #A32D2D; }

    /* ---------------------------------------------- 候选（另一块） */
    .candsHead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .candsTitle {
      font-size: 12px;
      font-weight: 500;
      color: #444441;
    }
    .candsTip { font-size: 11px; color: #8A8880; }
    .cand {
      display: flex;
      gap: 7px;
      padding: 6px 9px;
      border: 0.5px solid #D8D6CE;
      border-radius: 6px;
      margin-bottom: 5px;
      background: #FFFFFF;
      color: #5F5E5A;
      font-size: 12.5px;
      line-height: 1.45;
      word-break: break-all;
      cursor: pointer;
    }
    .cand:last-child { margin-bottom: 0; }
    .cand:hover { background: #EEF4FB; border-color: #85B7EB; }
    .candNo { flex: 0 0 auto; color: #B4B2A9; font-size: 11px; line-height: 1.7; }
    .candTxt { flex: 1; }
    /* 当前选中：深色底 + 蓝框，和上面那个框里是同一段文字 */
    .cand.sel {
      background: #85B7EB;
      border-color: #185FA5;
      color: #042C53;
      font-weight: 500;
      cursor: default;
    }
    .cand.sel:hover { background: #85B7EB; }
    .cand.sel .candNo { color: #0C447C; }
    .candsNote {
      font-size: 12px;
      line-height: 1.5;
      color: #854F0B;
      margin-top: 6px;
      white-space: pre-line;
      display: none;
    }
    .candsNote.show { display: block; }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: 0.5px solid #185FA5;
      border-radius: 8px;
      background: #E6F1FB;
      color: #0C447C;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #B5D4F4; }
    button:disabled { opacity: 0.5; cursor: default; }
    .hint {
      margin-top: 10px;
      color: #5F5E5A;
      font-size: 12px;
      line-height: 1.6;
    }
    kbd {
      font-family: Consolas, monospace;
      font-size: 11px;
      padding: 1px 5px;
      border: 0.5px solid #B4B2A9;
      border-radius: 4px;
      background: #F1EFE8;
    }
    .lnk {
      color: #185FA5;
      cursor: pointer;
      text-decoration: underline;
    }
    .lnk:hover { color: #0C447C; }
    #detail {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.6;
      word-break: break-all;
      display: none;
    }
    #detail.show {
      display: block;
      padding: 8px 9px;
      border-radius: 8px;
      background: #F1EFE8;
      color: #444441;
    }
    #detail.err {
      background: #FCEBEB;
      color: #791F1F;
    }
    /* 底部一行小字：每一路监听各记下了几条 + 当前版本号。
       出问题时能一眼看出是哪一路没在工作。 */
    .diag {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #8A8880;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>一键发到 QQ</h1>

  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="statusText">正在检查本地桥…</span>
  </div>

  <!-- 将要发送：文字单独被框住 -->
  <div class="sendbox" id="sendBox">
    <div class="sbHead" id="sbHead">正在读取剪贴板…</div>
    <div class="sbText" id="sbText"></div>
    <div class="sbMeta" id="sbMeta"></div>
  </div>

  <!-- 候选：另起一块 -->
  <div class="candsHead" id="candsHead" style="display:none">
    <span class="candsTitle" id="candsTitleText">最近的内容</span>
    <span class="candsTip">点一行改成发那条</span>
  </div>
  <div id="candsList"></div>
  <div class="candsNote" id="candsNote"></div>

  <button id="sendBtn">立即发送</button>

  <div class="hint" id="lastLine"></div>
  <div class="hint">
    快捷键 <kbd>Ctrl</kbd> + <kbd>B</kbd> 永远发最新那条，这里的选择不影响它。<br>
    <span class="lnk" id="clearLink">清空历史</span>
  </div>

  <div id="detail"></div>
  <div class="diag" id="diag"></div>

  <script src="popup.js"></script>
</body>
</html>
