<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #2C2C2A;
      background: #ffffff;
    }
    h1 {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 10px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 8px;
      background: #F1EFE8;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #B4B2A9;
      flex: 0 0 auto;
    }
    .dot.ok { background: #1D9E75; }
    .dot.bad { background: #E24B4A; }
    #statusText { flex: 1; }

    /* 候选列表：第 1 项永远是本次将要发送的那一份，下面跟更旧的内容 */
    .pv {
      border-radius: 8px;
      padding: 8px 10px 9px;
      margin-bottom: 10px;
      background: #E6F1FB;
      border: 0.5px solid #185FA5;
    }
    .pvHead {
      font-size: 12px;
      font-weight: 500;
      color: #0C447C;
      margin-bottom: 6px;
    }
    .pvMeta {
      font-size: 12px;
      line-height: 1.5;
      color: #185FA5;
      margin-top: 6px;
      white-space: pre-line;
    }
    .cand {
      padding: 6px 9px;
      border-radius: 6px;
      margin-bottom: 5px;
      background: #FFFFFF;
      color: #5F5E5A;
      font-size: 12.5px;
      line-height: 1.45;
      word-break: break-all;
      cursor: pointer;
    }
    .cand:last-child { margin-bottom: 0; }
    .cand:hover { background: #D6E8F8; }
    .cand.sel {
      background: #85B7EB;
      color: #042C53;
      font-weight: 500;
      cursor: default;
    }
    .cand.sel:hover { background: #85B7EB; }
    .pv.warn { background: #FAEEDA; border-color: #BA7517; }
    .pv.warn .pvHead { color: #633806; }
    .pv.warn .pvMeta { color: #854F0B; }
    .pv.warn .cand { color: #854F0B; background: #FFFFFF; }
    .pv.warn .cand:hover { background: #F3DCB4; }
    .pv.warn .cand.sel { background: #FAC775; color: #412402; }
    .pv.warn .cand.sel:hover { background: #FAC775; }
    .pv.err { background: #FCEBEB; border-color: #A32D2D; }
    .pv.err .pvHead { color: #791F1F; }
    .pv.err .pvMeta { color: #A32D2D; }

    button {
      width: 100%;
      padding: 9px;
      border: 0.5px solid #185FA5;
      border-radius: 8px;
      background: #E6F1FB;
      color: #0C447C;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #B5D4F4; }
    button:disabled { opacity: 0.5; cursor: default; }
    .hint {
      margin-top: 10px;
      color: #5F5E5A;
      font-size: 12px;
      line-height: 1.6;
    }
    kbd {
      font-family: Consolas, monospace;
      font-size: 11px;
      padding: 1px 5px;
      border: 0.5px solid #B4B2A9;
      border-radius: 4px;
      background: #F1EFE8;
    }
    .lnk {
      color: #185FA5;
      cursor: pointer;
      text-decoration: underline;
    }
    .lnk:hover { color: #0C447C; }
    #detail {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.6;
      word-break: break-all;
      display: none;
    }
    #detail.show {
      display: block;
      padding: 8px 9px;
      border-radius: 8px;
      background: #F1EFE8;
      color: #444441;
    }
    #detail.err {
      background: #FCEBEB;
      color: #791F1F;
    }
    /* 底部一行小字：每一路监听各记下了几条 + 当前版本号。
       出问题时能一眼看出是哪一路没在工作。 */
    .diag {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #8A8880;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>一键发到 QQ</h1>

  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="statusText">正在检查本地桥…</span>
  </div>

  <div class="pv" id="pv">
    <div class="pvHead" id="pvHead">正在读取剪贴板…</div>
    <div id="pvList"></div>
    <div class="pvMeta" id="pvMeta"></div>
  </div>

  <button id="sendBtn">立即发送</button>

  <div class="hint" id="lastLine"></div>
  <div class="hint">
    快捷键 <kbd>Ctrl</kbd> + <kbd>B</kbd> 永远发最新那条，这里的选择不影响它。<br>
    点一行可以改成发那条　·　<span class="lnk" id="clearLink">清空历史</span>
  </div>

  <div id="detail"></div>
  <div class="diag" id="diag"></div>

  <script src="popup.js"></script>
</body>
</html>
